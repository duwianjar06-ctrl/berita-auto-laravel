name: Deploy Missing Files

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-missing:
    name: Upload Missing Files Only
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, fileinfo, curl, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Install production dependencies
        run: |
          rm -f bootstrap/cache/packages.php
          rm -f bootstrap/cache/services.php
          rm -f bootstrap/cache/config.php
          rm -f bootstrap/cache/events.php

          composer install \
            --no-dev \
            --no-interaction \
            --prefer-dist \
            --no-progress \
            --optimize-autoloader

      - name: Verify FTP secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          test -n "$FTP_SERVER_DIR"

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Upload missing files only
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" \
            -p 21 \
            "ftp://$FTP_SERVER" <<EOF

          set cmd:fail-exit yes

          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true

          set net:timeout 30
          set net:max-retries 50
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 30

          set mirror:use-pget-n 1

          mirror \
            --reverse \
            --only-missing \
            --continue \
            --parallel=2 \
            --no-perms \
            --verbose \
            --exclude-glob ".git/**" \
            --exclude-glob ".github/**" \
            --exclude-glob ".env" \
            --exclude-glob ".env.*" \
            --exclude-glob "tests/**" \
            --exclude-glob "storage/logs/**" \
            ./ "$FTP_SERVER_DIR"

          bye
          EOF
