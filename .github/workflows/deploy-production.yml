name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, fileinfo, curl, pdo_mysql
          coverage: none
          tools: composer:v2
      - name: Validate Composer
        run: composer validate --strict
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Setup Node.js CI
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Node dependencies
        run: npm ci
      - name: Frontend build
        run: npm run build
      - name: Laravel checks
        run: |
          php artisan optimize:clear
          php artisan route:list
          php artisan schedule:list
      - name: Tests
        run: php artisan test
      - name: Clean Laravel generated manifests
        run: |
          php artisan optimize:clear || true
          rm -f bootstrap/cache/packages.php bootstrap/cache/services.php bootstrap/cache/config.php bootstrap/cache/events.php
      - name: Install production dependencies only
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
      - name: Verify production boot
        run: |
          php artisan package:discover --ansi
          php artisan about
          php artisan route:list
          php artisan schedule:list

  deploy:
    needs: test-build
    if: ${{ github.event_name == 'workflow_dispatch' || vars.RUMAHWEB_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, fileinfo, curl, pdo_mysql
          coverage: none
          tools: composer:v2
      - name: Install production dependencies
        run: |
          rm -f bootstrap/cache/packages.php bootstrap/cache/services.php bootstrap/cache/config.php bootstrap/cache/events.php
          composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
      - name: Verify Rumahweb secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER  }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME  }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD  }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR  }}
        run: |
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          test -n "$FTP_SERVER_DIR"
      - name: Deploy to Rumahweb over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER  }}
          username: ${{ secrets.FTP_USERNAME  }}
          password: ${{ secrets.FTP_PASSWORD  }}
          protocol: ftps
          port: 21
          server-dir: ${{ secrets.FTP_SERVER_DIR  }}
          local-dir: ./
          exclude: |
            **/.git*/**
            **/.env*
            **/tests/**
            **/storage/logs/**
