name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, fileinfo, curl, pdo_mysql
          coverage: none
          tools: composer:v2
      - name: Validate Composer
        run: composer validate --strict
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Setup Node.js CI
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Node dependencies
        run: npm ci
      - name: Frontend build
        run: npm run build
      - name: Laravel checks
        run: |
          php artisan optimize:clear
          php artisan route:list
          php artisan schedule:list
      - name: Tests
        run: php artisan test
      - name: Clean Laravel generated manifests
        run: |
          php artisan optimize:clear || true
          rm -f bootstrap/cache/packages.php bootstrap/cache/services.php bootstrap/cache/config.php bootstrap/cache/events.php
      - name: Install production dependencies only
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
      - name: Verify production boot
        run: |
          php artisan package:discover --ansi
          php artisan about
          php artisan route:list
          php artisan schedule:list

  deploy:
    needs: test-build
    if: ${{ github.event_name == 'workflow_dispatch' || vars.RUMAHWEB_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, fileinfo, curl, pdo_mysql
          coverage: none
          tools: composer:v2
      - name: Install production dependencies
        run: |
          rm -f bootstrap/cache/packages.php bootstrap/cache/services.php bootstrap/cache/config.php bootstrap/cache/events.php
          composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
      - name: Verify Rumahweb secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          test -n "$FTP_SERVER_DIR"
      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
      - name: Deploy to Rumahweb with resilient FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 "ftp://$FTP_SERVER" <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 30
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 30
          set mirror:use-pget-n 1
          set xfer:clobber true
          mirror --reverse --continue --parallel=1 --verbose \
            --exclude-glob ".git/**" \
            --exclude-glob ".github/**" \
            --exclude-glob ".env" \
            --exclude-glob ".env.*" \
            --exclude-glob "tests/**" \
            --exclude-glob "storage/logs/**" \
            ./ "$FTP_SERVER_DIR"
          bye
          EOF
