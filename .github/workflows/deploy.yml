name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, fileinfo, curl, pdo_mysql
          coverage: none
          tools: composer:v2
      - name: Validate Composer
        run: composer validate --strict
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verify Laravel public entrypoint
        run: |
          test -f public/index.php
          test -f public/.htaccess
          test -f public/robots.txt
      - name: Validate PHP and Blade templates
        run: |
          php -l app/Http/Controllers/PublicController.php
          php artisan optimize:clear
          php artisan view:cache
          php artisan view:clear
      - name: Laravel checks
        run: |
          php artisan about
          php artisan route:list
          php artisan schedule:list
      - name: Tests
        run: php artisan test
      - name: Frontend dependency/build check
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

  deploy:
    name: Smart FTPS Deploy
    needs: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, fileinfo, curl, pdo_mysql
          coverage: none
          tools: composer:v2
      - name: Install production Composer dependencies
        run: |
          rm -f bootstrap/cache/packages.php bootstrap/cache/services.php bootstrap/cache/config.php bootstrap/cache/events.php
          composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
      - name: Prepare frontend assets
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build frontend assets
        run: |
          npm ci
          npm run build
      - name: Validate deployment helper
        run: bash -n scripts/deploy/smart-deploy.sh
      - name: Verify Rumahweb secrets are present
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          test -n "$FTP_SERVER_DIR"
      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
      - name: Run smart resumable deployment
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          GITHUB_SHA: ${{ github.sha }}
        run: bash scripts/deploy/smart-deploy.sh
      - name: Force upload home Blade and clean compiled views
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/resources/views/home.blade.php"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 "ftp://$FTP_SERVER" <<LFTP
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:max-retries 30
          set net:timeout 30
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 30
          cd "$FTP_SERVER_DIR"
          put -O resources/views "$GITHUB_WORKSPACE/resources/views/home.blade.php"
          glob -a rm -f storage/framework/views/*.php
          bye
          LFTP
          echo "FORCE_UPLOAD_HOME_BLADE: SUCCESS"
          echo "BLADE_CACHE_CLEANUP: SUCCESS"
      - name: Verify production home Blade checksum
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          repo_sha="$(sha256sum "$GITHUB_WORKSPACE/resources/views/home.blade.php" | awk '{print $1}')"
          rm -f "$GITHUB_WORKSPACE/remote-home.blade.php"
          mkdir -p "$GITHUB_WORKSPACE/remote-download"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 "ftp://$FTP_SERVER" <<LFTP
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:max-retries 30
          set net:timeout 30
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 30
          cd "$FTP_SERVER_DIR"
          lcd "$GITHUB_WORKSPACE/remote-download"
          get resources/views/home.blade.php -o remote-home.blade.php
          bye
          LFTP
          cp "$GITHUB_WORKSPACE/remote-download/remote-home.blade.php" "$GITHUB_WORKSPACE/remote-home.blade.php"
          remote_sha="$(sha256sum "$GITHUB_WORKSPACE/remote-home.blade.php" | awk '{print $1}')"
          echo "REPOSITORY_HOME_BLADE_SHA256: $repo_sha"
          echo "REMOTE_HOME_BLADE_SHA256: $remote_sha"
          if [[ "$repo_sha" != "$remote_sha" ]]; then
            echo "REMOTE_HOME_BLADE_CHECKSUM_MATCH: NO"
            exit 1
          fi
          echo "REMOTE_HOME_BLADE_CHECKSUM_MATCH: YES"
      - name: Production HTTP health check
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 60 https://beritaauto.site/)"
          echo "PRODUCTION_HTTP_STATUS: $status"
          test "$status" = "200"
          echo "PRODUCTION_HEALTH: PASS"
