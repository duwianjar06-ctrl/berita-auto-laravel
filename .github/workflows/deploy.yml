name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, fileinfo, curl, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Validate Composer
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify Laravel public entrypoint
        run: |
          test -f public/index.php
          test -f public/.htaccess
          test -f public/robots.txt

      - name: Laravel checks
        run: |
          php artisan optimize:clear
          php artisan about
          php artisan route:list
          php artisan schedule:list

      - name: Tests
        run: php artisan test

      - name: Frontend dependency/build check
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

  deploy:
    name: Smart FTPS Deploy
    needs: test-build
    if: ${{ github.event_name == 'workflow_dispatch' || vars.RUMAHWEB_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, fileinfo, curl, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Install production Composer dependencies
        run: |
          rm -f bootstrap/cache/packages.php bootstrap/cache/services.php bootstrap/cache/config.php bootstrap/cache/events.php
          composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Prepare frontend assets
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Validate deployment helper
        run: bash -n scripts/deploy/smart-deploy.sh

      - name: Verify Rumahweb secrets are present
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          test -n "$FTP_SERVER_DIR"

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Run smart resumable deployment
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          GITHUB_SHA: ${{ github.sha }}
        run: bash scripts/deploy/smart-deploy.sh
